version: "3.9"
services:
  web:
    build: .
    command: gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker -w 4 -b 0.0.0.0:8000
    volumes:
      - ./app:/app
      - ./media:/media
    env_file: .env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
  worker:
    build: .
    command: celery -A config worker -l INFO
    volumes:
      - ./app:/app
      - ./media:/media
    env_file: .env
    depends_on:
      - db
      - redis
  beat:
    build: .
    command: celery -A config beat -l INFO
    volumes:
      - ./app:/app
      - ./media:/media
    env_file: .env
    depends_on:
      - db
      - redis
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: paa
      POSTGRES_USER: paa
      POSTGRES_PASSWORD: paa
    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:7
volumes:
  db_data:
